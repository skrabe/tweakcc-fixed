name: Release & Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check release metadata
        run: node tools/checkReleaseMeta.mjs

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      # Recorded before the publish, so that moving a tag to correct a prompts
      # JSON is legible from the run alone. That move is how a correction now
      # reaches an already-published version, since clients read
      # refs/tags/v<version>: the release updates, and npm refuses a second
      # publish of a version that exists, which is the registry's immutability
      # working rather than a fault. Green throughout shipped a new version; a
      # run whose only red step is the publish re-pointed an existing one.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
